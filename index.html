<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loop AI · Local</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body><aside><a class="brand" href="./">◈ <span>Loop AI</span></a><button id="newChat">＋ 새 대화</button><div class="aside-note">생각을 꺼내는 공간.<br>질문부터 아이디어까지.</div><small>LOOP’S STUDIO</small></aside><main><header><span>Loop AI <small>내 PC에서 실행</small></span><button id="settings">모델 연결 확인</button></header><section id="messages" role="log" aria-label="대화" aria-live="polite"><div id="welcome"><div class="orb">◈</div><p class="eyebrow">A LITTLE CURIOSITY, A NEW POSSIBILITY</p><h1>어떤 생각을 하고 있어?</h1><p>궁금한 것, 만들고 싶은 것. 편하게 물어봐.</p><div class="suggestions"><button>로블록스 게임 아이디어 3개 추천해줘</button><button>이해하기 쉽게 파이썬 변수를 설명해줘</button><button>유튜브 영상 제목을 같이 생각해줘</button></div></div></section><footer><div id="status" role="status"></div><form id="chatForm"><label class="sr-only" for="prompt">메시지</label><textarea id="prompt" rows="1" maxlength="4000" placeholder="Loop AI에게 물어보기…"></textarea><button id="send" type="submit" aria-label="보내기">↑</button></form><small>AI 답변은 틀릴 수 있어요. 대화는 이 PC의 모델에서 처리되며 새로고침하면 사라집니다.</small></footer></main>
</body></html>
