<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Loop AI</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>

<body>
  <aside>
    <a class="brand" href="./">
      ◈ <span>Loop AI</span>
    </a>

    <button id="newChat" type="button">＋ 새 대화</button>

    <div class="aside-note">
      생각을 꺼내는 공간.<br>
      질문부터 아이디어까지.
    </div>

    <small>LOOP’S STUDIO</small>
  </aside>

  <main>
    <header>
      <span>
        Loop AI
        <small>대화 도우미</small>
      </span>

      <button id="settings" type="button">접속 설정</button>
    </header>

    <section
      id="messages"
      role="log"
      aria-label="대화"
      aria-live="polite"
    >
      <div id="welcome">
        <div class="orb">◈</div>

        <p class="eyebrow">
          A LITTLE CURIOSITY, A NEW POSSIBILITY
        </p>

        <h1>어떤 생각을 하고 있어?</h1>
        <p>궁금한 것, 만들고 싶은 것. 편하게 물어봐.</p>

        <div class="suggestions">
          <button type="button">
            로블록스 게임 아이디어 3개 추천해줘
          </button>

          <button type="button">
            이해하기 쉽게 파이썬 변수를 설명해줘
          </button>

          <button type="button">
            유튜브 영상 제목을 같이 생각해줘
          </button>
        </div>
      </div>
    </section>

    <footer>
      <div id="status" role="status"></div>

      <form id="chatForm">
        <label class="sr-only" for="prompt">메시지</label>

        <textarea
          id="prompt"
          rows="1"
          maxlength="4000"
          placeholder="Loop AI에게 물어보기…"
        ></textarea>

        <button id="send" type="submit" aria-label="보내기">
          ↑
        </button>
      </form>

      <small>
        AI 답변은 틀릴 수 있어요.
        전송한 대화는 AI 서비스에서 처리됩니다.
      </small>
    </footer>
  </main>

  <dialog id="config">
    <form method="dialog">
      <h2>접속 설정</h2>

      <p>사이트 운영자가 알려준 접속 암호를 입력해 주세요.</p>

      <label for="password">접속 암호</label>

      <input
        id="password"
        type="password"
        autocomplete="off"
        placeholder="OpenAI API 키가 아닙니다"
      >

      <p>
        <small>
          암호와 대화는 이 페이지를 닫으면 사라집니다.
        </small>
      </p>

      <button type="submit">저장</button>
    </form>
  </dialog>
</body>
</html>
